services:
  cpf-nro-postgres:
    image: postgres:18-alpine
    container_name: cpf-nro-postgres
    environment:
      POSTGRES_DB: nrodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      cpf-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nrodb -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  cpf-nro-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpf-nro-service
    environment:
      TP_DB_URL: jdbc:postgresql://cpf-nro-postgres:5432/nrodb
      TP_DB_USER: postgres
      TP_DB_PASSWORD: postgres
      TP_ID: TrustedParty
      TP_FQDN: trusted-party:8020
      TP_TRUSTED_CERTS_DIR: /certs/trusted
      TP_PUBLIC_CERT_PATH: /certs/service/nro.pem
      TP_PRIVATE_KEY_PATH: /certs/service/nro.key
    ports:
      - 8082:8020
    volumes:
      - ./certs:/certs:ro
    networks:
      cpf-net:
        aliases:
          - nro-service
    depends_on:
      cpf-nro-postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      timeout: 5s
      retries: 10
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:8020/api/v1/info || exit 1"]

networks:
  cpf-net:
    name: cpf-net
    driver: bridge

volumes:
  postgres_data:
